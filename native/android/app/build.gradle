plugins { id 'com.android.application' }

def debugApiBaseUrl = project.findProperty("apiBaseUrl") ?: "http://192.168.0.104:8080"
def debugPortalBaseUrl = project.findProperty("portalBaseUrl") ?: "http://192.168.0.104:5173"
def releaseApiBaseUrl = project.findProperty("releaseApiBaseUrl") ?: "https://api.example.invalid"
def releasePortalBaseUrl = project.findProperty("releasePortalBaseUrl") ?: "https://portal.example.invalid"
android {
    namespace 'com.gmc1987.chronos.mobile'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.gmc1987.chronos.mobile';
        minSdk 26;
        targetSdk 35;
        versionCode 1;
        versionName '0.1.0';
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', "\"${debugApiBaseUrl}\""
            buildConfigField 'String', 'PORTAL_BASE_URL', "\"${debugPortalBaseUrl}\""
        }
        release {
            buildConfigField 'String', 'API_BASE_URL', "\"${releaseApiBaseUrl}\""
            buildConfigField 'String', 'PORTAL_BASE_URL', "\"${releasePortalBaseUrl}\""
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
