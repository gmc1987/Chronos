server:
  port: ${CHRONOS_SERVER_PORT:8080}
  # 兼容升级前包含大量权限码的历史 JWT；新 Token 已改为最小声明。
  max-http-request-header-size: ${CHRONOS_MAX_HTTP_REQUEST_HEADER_SIZE:32KB}

security:
  cors:
    allowed-origin-patterns: ${CHRONOS_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${CHRONOS_JWT_SECRET:change-this-education-secret-before-production}
    expiration-ms: ${CHRONOS_JWT_EXPIRATION_MS:2592000000}
    refresh-token-expiration-ms: ${CHRONOS_REFRESH_TOKEN_EXPIRATION_MS:2592000000}

spring:
  application:
    name: Chronos-Education
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/ChronosEducation}
    username: ${CHRONOS_DB_USERNAME:Chronos}
    password: ${CHRONOS_DB_PASSWORD:Chronos123}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 20MB
  jpa:
    database: postgresql
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      # 生产默认只校验 Flyway 管理的结构，禁止 Hibernate 静默修改数据库。
      ddl-auto: ${CHRONOS_JPA_DDL_AUTO:validate}
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    # V0 是新环境基线；共享教育数据库可能包含由其他应用拥有的更高版本，
    # 对教育应用不可解析的历史迁移只读跳过，不修改或删除其数据。
    ignore-migration-patterns: "*:missing,*:ignored"

# Kubernetes probes must not claim database availability. Liveness is only
# process health; readiness deliberately reports database/Flyway failures.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db
      show-details: never
  data:
    redis:
      host: ${CHRONOS_REDIS_HOST:127.0.0.1}
      port: ${CHRONOS_REDIS_PORT:6379}
          

flowable:
  # Flowable 表结构同样由 Flyway 基线管理，生产环境禁止引擎在启动时静默改表。
  database-schema-update: ${CHRONOS_FLOWABLE_SCHEMA_UPDATE:false}
  async-executor-activate: true
  history-level: audit

minio:
  endpoint: ${CHRONOS_MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${CHRONOS_MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${CHRONOS_MINIO_SECRET_KEY:minioadmin}

chronos:
  industry:
    active: EDUCATION
  file:
    storage-type: ${CHRONOS_FILE_STORAGE_TYPE:MINIO}
    storage-path: ${CHRONOS_FILE_STORAGE_PATH:./data/files}
    minio-bucket: ${CHRONOS_FILE_MINIO_BUCKET:chronos-education-files}
  message:
    # 教育生产模板默认使用对象存储，避免多实例部署时公告附件只存在单机磁盘。
    storage-type: ${CHRONOS_MESSAGE_STORAGE_TYPE:MINIO}
    storage-path: ${CHRONOS_MESSAGE_STORAGE_PATH:./data/publications}
    minio-bucket: ${CHRONOS_MESSAGE_MINIO_BUCKET:chronos-education-publications}
    lifecycle-delay-ms: ${CHRONOS_MESSAGE_LIFECYCLE_DELAY_MS:30000}
    delivery-delay-ms: ${CHRONOS_MESSAGE_DELIVERY_DELAY_MS:10000}
  workflow:
    executors:
      http:
        enabled: ${WORKFLOW_HTTP_EXECUTOR_ENABLED:false}
        allowed-hosts: ${WORKFLOW_HTTP_ALLOWED_HOSTS:}
      agent:
        enabled: ${WORKFLOW_AGENT_EXECUTOR_ENABLED:false}
        base-url: ${WORKFLOW_AGENT_BASE_URL:}
