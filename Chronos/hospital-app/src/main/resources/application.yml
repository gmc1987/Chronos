server:
  port: 8080
  # 兼容升级前包含大量权限码的历史 JWT；新 Token 已改为最小声明。
  max-http-request-header-size: ${CHRONOS_MAX_HTTP_REQUEST_HEADER_SIZE:32KB}
security:
  cors:
    allowed-origin-patterns: ${CHRONOS_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret: ${CHRONOS_JWT_SECRET:1qaz2wxcde34rfvbgt56yhnmju78iklo90p}
    expiration-ms: ${CHRONOS_JWT_EXPIRATION_MS:2592000000}
    refresh-token-expiration-ms: ${CHRONOS_REFRESH_TOKEN_EXPIRATION_MS:2592000000}
minio:
  endpoint: ${CHRONOS_MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${CHRONOS_MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${CHRONOS_MINIO_SECRET_KEY:minioadmin}

spring:
  application:
    name: Chronos
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5432/Chronos}
    username: ${CHRONOS_DB_USERNAME:Chronos}
    password: ${CHRONOS_DB_PASSWORD:Chronos123}
    driver-class-name: org.postgresql.Driver
    druid:
      max-wait: 10000
      max-active: 50
      test-on-borrow: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: select 1
      test-while-idle: true
      test-on-return: false
      pool-prepared-statements: true
      max-open-prepared-statements: 20
      filters: stat, wall
      web-stat-filter:
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 20MB
  jpa:
    database: postgresql
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: ${CHRONOS_JPA_DDL_AUTO:update}
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      platform: postgresql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  ai:
    model:
      # 未配置密钥时不实例化远程模型，避免本地和 CI 启动失败。
      chat: ${CHRONOS_AI_CHAT_MODEL:none}
    deepseek:
      api-key: ${CHRONOS_DEEPSEEK_CHAT_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-pro
flowable:
  database-schema-update: true
  async-executor-activate: true
  history-level: audit
chronos:
  industry:
    # 医院部署包仅包含医院模板，错误的行业值会在启动时直接失败。
    active: ${CHRONOS_INDUSTRY:HOSPITAL}
  message:
    storage-type: ${CHRONOS_MESSAGE_STORAGE_TYPE:LOCAL}
    # 生产环境应挂载到持久化磁盘，或后续替换为 MinIO 存储实现。
    storage-path: ${CHRONOS_MESSAGE_STORAGE_PATH:./data/publications}
    minio-bucket: ${CHRONOS_MESSAGE_MINIO_BUCKET:chronos-publications}
    lifecycle-delay-ms: ${CHRONOS_MESSAGE_LIFECYCLE_DELAY_MS:30000}
    delivery-delay-ms: ${CHRONOS_MESSAGE_DELIVERY_DELAY_MS:10000}
  workflow:
    executors:
      # 外部执行器默认关闭；生产环境通过环境变量显式启用并限制可信主机。
      http:
        enabled: ${WORKFLOW_HTTP_EXECUTOR_ENABLED:false}
        allowed-hosts: ${WORKFLOW_HTTP_ALLOWED_HOSTS:}
      agent:
        enabled: ${WORKFLOW_AGENT_EXECUTOR_ENABLED:false}
        base-url: ${WORKFLOW_AGENT_BASE_URL:}
logging:
  level:
    org:
      hibernate:
        SQL: error
        type:
          descriptor:
            sql:
              BasicBinder: trace
