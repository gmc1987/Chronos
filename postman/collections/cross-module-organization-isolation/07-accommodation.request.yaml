$kind: http-request
name: Accommodation buildings expose an organization boundary
order: 7000
method: GET
url: '{{base_url}}/admin/education/accommodations/buildings'
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('accommodation resources are limited to the allowed school', () => {
        pm.response.to.have.status(200);
        body.data.forEach(row => pm.expect(row.organizationId).to.eql(pm.collectionVariables.get('allowed_org_id')));
      });
