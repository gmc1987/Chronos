$kind: http-request
name: Admission candidates expose an organization boundary
order: 4200
method: GET
url: '{{base_url}}/admin/education/admissions?page=0&size=100&status=&keyword='
queryParams:
  - key: page
    value: '0'
  - key: size
    value: '100'
  - key: status
    value: ''
  - key: keyword
    value: ''
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('admission candidates are limited to the allowed school', () => {
        pm.response.to.have.status(200);
        body.data.content.forEach(row => pm.expect(row.organizationId).to.eql(pm.collectionVariables.get('allowed_org_id')));
      });
