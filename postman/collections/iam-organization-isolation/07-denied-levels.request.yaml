$kind: http-request
name: Scoped manager cannot read another organization job levels
order: 7000
method: GET
url: '{{base_url}}/admin/iam/job-levels?organizationId={{denied_org_id}}'
queryParams:
  - key: organizationId
    value: '{{denied_org_id}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('cross-organization job-level access is forbidden', () => {
        pm.response.to.have.status(403);
      });
