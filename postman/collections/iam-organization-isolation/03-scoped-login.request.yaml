$kind: http-request
name: Scoped manager login
order: 3000
method: POST
url: '{{base_url}}/auth/login'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"username":"{{scope_username}}","password":"{{scope_password}}"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('scoped manager login succeeds', () => {
        pm.response.to.have.status(200);
        pm.expect(body.code).to.eql('200');
        pm.expect(body.data.accessToken).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('scope_token', body.data.accessToken);
