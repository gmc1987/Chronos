$kind: http-request
name: Operation agent accepts a bare week count on the next turn
order: 13000
method: POST
url: '{{base_url}}/agent/operations/conversation'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "request":"20",
      "contextMessages":[
        "请帮我创建2094年度第二学期，同时完成教学日历和校区作息方案",
        "开始日期：2094-09-01；结束日期：2095-01-30"
      ],
      "semesterCode":"2094-2095-2",
      "organizationId":"{{hv_org_id}}",
      "candidateOnly":true,
      "createMissingTerm":true
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const required = body.data.draft.requiredInputs.map(item => item.key);
      const term = body.data.draft.plan.steps.find(item => item.toolCode === 'academic.term.create');
      pm.test('bare 20 is consumed as the only missing term field', () => {
        pm.response.to.have.status(200);
        pm.expect(body.data.status).to.eql('NEED_INPUT');
        pm.expect(required).to.eql(['campusId', 'scheduleName', 'periods']);
        pm.expect(term.toolConfig).to.include({
          startDate: '2094-09-01',
          endDate: '2095-01-30',
          weekCount: 20
        });
      });
